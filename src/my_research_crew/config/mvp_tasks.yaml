backlog_grooming_task:
  description: "Analyze the project_requirement and break it down into prioritized user stories with Given-When-Then acceptance criteria."
  expected_output: "backlog"
  agent: "product_owner"

architecture_review_task:
  description: "Review the backlog and propose API contract and data structures (OpenAPI-like)."
  expected_output: "api_spec"
  agent: "scrum_master"

backend_development_task:
  description: "Implement the backend design and provide code bundle and DB schema."
  expected_output: "code_bundle"
  agent: "backend_engineer"

frontend_development_task:
  description: "Create frontend components consistent with the API contract."
  expected_output: "code_bundle"
  agent: "frontend_engineer"

qa_testing_task:
  description: "Write a test plan and sample test cases verifying acceptance criteria."
  expected_output: "test_plan"
  agent: "qa_tester"
